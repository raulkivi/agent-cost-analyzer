<!-- Phase 12 task A0 spike view (docs/plans/mcp-apps-spike.md). Dev only. The
     build (npm run spike:build --workspace=packages/server) inlines the
     bundled script at the marker below and writes dist/spike-view.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="aca-brand" content="">
    <title>A0 host spike</title>
    <style>
      /* Only local() sources: the default CSP allows no network or data: fonts. */
      @font-face {
        font-family: "Spike Local Heading";
        src: local("Barlow Condensed"), local("BarlowCondensed-Regular");
      }
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 12px;
        font-family: var(--font-sans, system-ui, sans-serif);
        font-size: var(--font-text-sm-size, 13px);
        color: var(--color-text-primary, CanvasText);
        background: var(--color-background-primary, transparent);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-family: "Spike Local Heading", monospace;
      }
      h1 small {
        font: 11px var(--font-sans, system-ui, sans-serif);
        color: var(--color-text-secondary, GrayText);
      }
      .card {
        border: var(--border-width-regular, 1px) solid var(--color-border-primary, GrayText);
        border-radius: var(--border-radius-md, 6px);
        padding: 8px 10px;
        margin-bottom: 10px;
        background: var(--color-background-secondary, transparent);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin: 6px 0;
      }
      button {
        font: inherit;
        color: var(--color-text-primary, ButtonText);
        background: var(--color-background-tertiary, ButtonFace);
        border: var(--border-width-regular, 1px) solid var(--color-border-primary, ButtonBorder);
        border-radius: var(--border-radius-sm, 4px);
        padding: 4px 10px;
        cursor: pointer;
      }
      .status {
        color: var(--color-text-secondary, GrayText);
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      pre {
        margin: 0;
        padding: 8px;
        max-height: 260px;
        overflow: auto;
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: var(--border-width-regular, 1px) solid var(--color-border-secondary, GrayText);
      }
      #summary {
        margin-bottom: 8px;
      }
      .swatches span {
        display: inline-block;
        width: 18px;
        height: 18px;
        margin-right: 4px;
        border: 1px solid var(--color-border-primary, GrayText);
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <h1>A0 host spike <small>Barlow Condensed via local() if installed, else monospace</small></h1>

    <div class="card">
      <b>What the host sent</b>
      <pre id="summary">connecting...</pre>
      <div class="swatches" aria-hidden="true">
        <span style="background: var(--color-background-primary, transparent)"></span>
        <span style="background: var(--color-background-secondary, transparent)"></span>
        <span style="background: var(--color-text-primary, CanvasText)"></span>
        <span style="background: var(--color-text-secondary, GrayText)"></span>
        <span style="background: var(--color-border-primary, GrayText)"></span>
        <span style="background: var(--color-text-danger, red)"></span>
        <span style="background: var(--color-text-warning, orange)"></span>
        <span style="background: var(--color-text-info, blue)"></span>
      </div>
    </div>

    <div class="card">
      <b>Tests</b>
      <div id="tests"></div>
    </div>

    <div class="card">
      <b>Report</b>
      <div class="row">
        <button id="copy" type="button">Copy report</button>
        <button id="refresh" type="button">Refresh</button>
        <span id="copy-status" class="status"></span>
      </div>
      <pre id="report"></pre>
    </div>

    <!--SPIKE_SCRIPT-->
  </body>
</html>
