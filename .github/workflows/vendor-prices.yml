name: Vendor prices

# Weekly: diff the vendor profiles' prices against GitHub's published Copilot
# price table (docs/plans/vendor-aware-learn-simulation.md §6, D9) and keep one
# issue up to date. It only reports; a price change is a reviewed, sourced data
# edit (edit the JSON, cite the source, run the golden tests), never a commit
# from this workflow. Cache-rule changes are reviewed by hand.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: diff
        run: npm run --silent vendor-prices:diff -- --out "$RUNNER_TEMP/report.md"

      - name: Open or update the vendor-prices issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/report.md
        run: |
          gh label create vendor-prices --description "Vendor price table drift" --force
          {
            echo "GitHub's Copilot price table differs from \`packages/server/fixtures/vendor-profiles/*.json\` (checked $(date -u +%F))."
            echo
            cat "$REPORT"
            echo
            echo "Update the profile prices with a source and run the golden tests; review the snapshot diff."
          } > "$RUNNER_TEMP/body.md"
          existing=$(gh issue list --label vendor-prices --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "Vendor prices changed in GitHub's Copilot price table" \
              --label vendor-prices --body-file "$RUNNER_TEMP/body.md"
          fi
