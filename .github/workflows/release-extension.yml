name: Release AI Credits Analyzer

# Publishes the VS Code extension on an `ext-v<major>.<minor>.<patch>` tag
# (vscode-extension.md §7.2). An odd minor goes to the pre-release channel.
# Setup (one-time, §7.0): a `release` environment with required reviewers,
# variables AZURE_CLIENT_ID and AZURE_TENANT_ID (an Entra ID app with a
# federated credential for this environment, a member of the `raulkivi`
# publisher) and the secret OVSX_PAT.

on:
  push:
    tags: ["ext-v*"]

permissions:
  contents: read

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag must name package.json's version, and engines.vscode must be
      # the current stable VS Code (D9).
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: node packages/vscode-extension/scripts/release-check.mts "$TAG" ext-v packages/vscode-extension/package.json --engine >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: xvfb-run -a npm run test:integration --workspace=packages/vscode-extension

      - name: Package
        env:
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        working-directory: packages/vscode-extension
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npx vsce package --no-dependencies --pre-release
          else
            npx vsce package --no-dependencies
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub Release
      id-token: write # Entra ID sign-in through OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix

      - name: Release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: node packages/vscode-extension/scripts/release-notes.mts packages/vscode-extension/CHANGELOG.md "$VERSION" > release-notes.md

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Pre-release is already set in the .vsix (package step), so publish
      # takes the package as it is.
      - name: Publish to the VS Code Marketplace
        working-directory: packages/vscode-extension
        run: npx vsce publish --azure-credential --packagePath ../../vsix/*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish vsix/*.vsix

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" vsix/*.vsix --title "AI Credits Analyzer $VERSION" --notes-file release-notes.md --verify-tag $flags
