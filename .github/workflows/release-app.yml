name: Release Agent Cost Analyzer

# A GitHub Release for the standalone app on an `app-v<major>.<minor>.<patch>`
# tag (vscode-extension.md §7.2). It runs from source, so there's nothing
# to upload: the notes are the root CHANGELOG.md's section for the version.

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag must name the root package.json's version.
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: node packages/vscode-extension/scripts/release-check.mts "$TAG" app-v package.json >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The standalone app's usage-scenario suite, as the web-e2e job in ci.yml
      # runs it (step 15.9). The root build above already builds packages/web.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - run: npm run test:e2e --workspace=packages/web -- --trace off
      # Failure screenshots (traces are off, as the suite runs in CI).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-out
          path: packages/web/e2e/out/
          if-no-files-found: ignore

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          node packages/vscode-extension/scripts/release-notes.mts CHANGELOG.md "$VERSION" > release-notes.md
          gh release create "$TAG" --title "Agent Cost Analyzer $VERSION" --notes-file release-notes.md --verify-tag
