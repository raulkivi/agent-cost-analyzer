name: Release Agent Cost Analyzer

# Publishes the standalone app on an `app-v<major>.<minor>.<patch>` tag
# (vscode-extension.md §7.2, npm-package.md §4.10): the `agent-cost-analyzer`
# npm package, then its look-alike alias `agent-cost-analyser` (npm-package.md # codespell:ignore analyser
# D3; published only while its own version is absent from npm), then a GitHub
# Release with the main tarball and the Claude Desktop bundle (`.mcpb`, built
# from that tarball's files) attached. The
# build job tests and packs once; the publish job, in the `release`
# environment, publishes exactly that tarball (SHA-256 checked) through npm
# trusted publishing (OIDC), which also attaches the provenance attestation.
# No npm token or secret exists. A manual run (workflow_dispatch) is a dry
# run: it builds, tests, packs and dry-runs the publish, and skips publish.
# Setup is the owner's, before the first tag:
# an npm trusted publisher on each of the two packages (user `raulkivi`,
# repository `agent-cost-analyzer`, workflow `release-app.yml`, environment
# `release`; npm expires it unused after 2 days) and `app-v*` added to the `release`
# environment's deployment rule (NP11/V17).
# After the npm publish, a last job lists the server in the MCP Registry (it
# warns and never fails the run; mcp-client-setup.md §5.7, D10).

on:
  push:
    tags: ["app-v*"]
  # A dry run: the build job runs in full, the publish job is skipped.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      alias-tarball: ${{ steps.pack-alias.outputs.tarball }}
      alias-version: ${{ steps.pack-alias.outputs.version }}
      mcpb: ${{ steps.mcpb.outputs.mcpb }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The publish job's exact Node, so the dry run uses its bundled npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      - run: npm ci

      # The tag must name the root package.json's version and packages/cli's.
      # A dispatch has no tag, so it checks the two versions against each
      # other under the tag the current version would get.
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="app-v$(node -p "require('./package.json').version")"
          fi
          node packages/vscode-extension/scripts/release-check.mts "$TAG" app-v package.json --also packages/cli/package.json --also packages/cli/server.json >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The standalone app's usage-scenario suite, as the web-e2e job in ci.yml
      # runs it (step 15.9). The root build above already builds packages/web.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - run: npm run test:e2e --workspace=packages/web -- --trace off
      # Failure screenshots (traces are off, as the suite runs in CI).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-out
          path: packages/web/e2e/out/
          if-no-files-found: ignore

      # The MCP App views in a fake MCP Apps host, as the mcp-apps-e2e job in
      # ci.yml runs it (step 10.17 G5). The root build above builds
      # packages/mcp-apps/dist/views.html.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/mcp-apps
      - run: npm run test:e2e --workspace=packages/mcp-apps -- --trace off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mcp-apps-e2e-out
          path: packages/mcp-apps/e2e/out/
          if-no-files-found: ignore

      # Dependencies bundled into the package are invisible to users' own
      # `npm audit`, so a high-severity finding blocks the release (§5).
      - run: npm audit --omit=dev --audit-level=high

      # One pack; every later step and the publish job use this file. Tarball
      # paths start with `./`, as npm reads a bare `dir/x.tgz` as a repo spec.
      - id: pack
        run: |
          mkdir npm-release
          # Into a file, not a pipe: a synchronous stdin read throws EAGAIN when npm is slow (the 0.16.0 publish).
          npm pack --workspace=packages/cli --pack-destination npm-release --json > "$RUNNER_TEMP/pack-main.json"
          node -e 'const fs = require("fs"); process.stdout.write("tarball=" + JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack-main.json", "utf8"))[0].filename + "\n")' >> "$GITHUB_OUTPUT"

      # The look-alike alias, depending on the package above (D3); its version
      # is its own, so the publish job can skip it once it is on npm.
      - id: pack-alias
        run: |
          npm pack --workspace=packages/cli-alias --pack-destination npm-release --json > "$RUNNER_TEMP/pack-alias.json"
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack-alias.json", "utf8"))[0]; process.stdout.write("tarball=" + p.filename + "\nversion=" + p.version + "\n")' >> "$GITHUB_OUTPUT"

      # The Claude Desktop bundle (mcp-client-setup.md §5.7, MC15): the main
      # tarball's files plus a manifest.json, so it holds exactly what npm
      # ships. Built from the file packed above, never from a fresh build.
      - id: mcpb
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          npm run mcpb:build -- --tarball "./npm-release/$TARBALL" --out npm-release
          echo "mcpb=agent-cost-analyzer-$VERSION.mcpb" >> "$GITHUB_OUTPUT"

      - name: SHA-256
        working-directory: npm-release
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          ALIAS_TARBALL: ${{ steps.pack-alias.outputs.tarball }}
          MCPB: ${{ steps.mcpb.outputs.mcpb }}
        run: sha256sum "$TARBALL" "$ALIAS_TARBALL" "$MCPB" | tee SHA256SUMS

      # Unpack the bundle, start its server with the manifest's own command and
      # require tools/list to match the snapshot. Before the npm smoke, so no
      # step that runs npm sits between that smoke and the upload.
      - name: Smoke test the Claude Desktop bundle
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          MCPB: ${{ steps.mcpb.outputs.mcpb }}
        run: npm run smoke:mcpb -- --tarball "./npm-release/$TARBALL" --bundle "./npm-release/$MCPB"
      # Install, start and drive the packed tarball in a browser (NP7); the
      # Chromium from the web suite above is the one it uses.
      - name: Smoke test the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          ALIAS_TARBALL: ${{ steps.pack-alias.outputs.tarball }}
        run: npm run smoke:npm-package -- --tarball "./npm-release/$TARBALL" --alias-tarball "./npm-release/$ALIAS_TARBALL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: npm-smoke-out
          path: packages/cli/smoke/out/
          if-no-files-found: ignore

      - name: Release notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: node packages/vscode-extension/scripts/release-notes.mts CHANGELOG.md "$VERSION" > npm-release/release-notes.md

      # The smoke ran npm after the checksum, so check the tarball again.
      - name: Verify the tarball still matches SHA256SUMS
        run: node scripts/verify-sha256.mjs npm-release/SHA256SUMS

      # Upload straight after the pack, checksum and smoke, before any step
      # that installs or runs another npm. Artifacts are immutable once
      # uploaded, so nothing later in this job can change what the publish job
      # downloads: its SHA-256 check proves the transfer, and "tested equals
      # published" rests on that immutability.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: npm-release/
          if-no-files-found: error

      # The same npm the publish job runs, so a refusal shows here first. It
      # runs after the upload and only reads the tarball.
      - name: Publish dry run
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          ALIAS_TARBALL: ${{ steps.pack-alias.outputs.tarball }}
          ALIAS_VERSION: ${{ steps.pack-alias.outputs.version }}
        # npm 11 refuses a dry run of a version already on npm, and the alias
        # keeps its version across app releases; skip it as the publish does.
        run: |
          npm publish --dry-run "./npm-release/$TARBALL"
          if npm view "agent-cost-analyser@$ALIAS_VERSION" version > "$RUNNER_TEMP/alias-version.txt" 2>/dev/null && [ -s "$RUNNER_TEMP/alias-version.txt" ]; then # codespell:ignore analyser
            echo "agent-cost-analyser@$ALIAS_VERSION is already on npm; skipping the alias dry run (already published)." # codespell:ignore analyser
          else
            npm publish --dry-run "./npm-release/$ALIAS_TARBALL"
          fi

  publish:
    needs: build
    # Never on a workflow_dispatch dry run, whatever ref it runs on.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing through OIDC
    env:
      TARBALL: ./npm-release/${{ needs.build.outputs.tarball }}
      ALIAS_TARBALL: ./npm-release/${{ needs.build.outputs.alias-tarball }}
      ALIAS_VERSION: ${{ needs.build.outputs.alias-version }}
      MCPB: ./npm-release/${{ needs.build.outputs.mcpb }}
    steps:
      # Only for the scripts/ checks and the repository `gh` needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: npm-release

      - name: Verify the tarball is the one the build tested
        run: node scripts/verify-sha256.mjs npm-release/SHA256SUMS

      # Trusted publishing needs npm 11.5.1+. Node 24.22.3 bundles npm
      # 11.19.1; using the bundled npm avoids an `npm install -g`, which
      # Scorecard flags as not pinned by hash (Pinned-Dependencies).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org

      # The package exists as the owner's placeholder, so this check always
      # applies: refuse to publish to a package anyone else maintains.
      - name: Check the maintainers
        run: |
          npm view agent-cost-analyzer maintainers --json > "$RUNNER_TEMP/maintainers.json"
          node scripts/check-npm-maintainers.mjs raulkivi "$RUNNER_TEMP/maintainers.json"

      # No npm token: npm signs in through OIDC and adds provenance.
      - name: Publish to npm
        run: npm publish "$TARBALL" --access public

      # The alias depends on the package above by a range, so it is republished
      # only when its own version changes. Not on npm yet (404) means publish;
      # the maintainer check applies as it did to the main package.
      - name: Publish the alias to npm
        run: |
          if npm view "agent-cost-analyser@$ALIAS_VERSION" version > "$RUNNER_TEMP/alias-version.txt" 2>/dev/null && [ -s "$RUNNER_TEMP/alias-version.txt" ]; then # codespell:ignore analyser
            echo "agent-cost-analyser@$ALIAS_VERSION is already on npm; skipping the alias publish (already published)." # codespell:ignore analyser
            exit 0
          fi
          npm view agent-cost-analyser maintainers --json > "$RUNNER_TEMP/alias-maintainers.json" # codespell:ignore analyser
          node scripts/check-npm-maintainers.mjs raulkivi "$RUNNER_TEMP/alias-maintainers.json"
          npm publish "$ALIAS_TARBALL" --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$TAG" "$TARBALL" "$MCPB" --title "Agent Cost Analyzer $VERSION" --notes-file npm-release/release-notes.md --verify-tag

  # Lists the just-published package in the official MCP Registry
  # (mcp-client-setup.md §5.7). The registry checks `mcpName` in the npm
  # package, so this runs only after `publish`. A registry failure warns and
  # never fails the release (D10): re-run the job later. Sign-in is GitHub
  # OIDC for the `io.github.raulkivi` namespace; no secret exists. The
  # publisher is pinned to a release, and the archive must match the pinned
  # SHA-256 and its Sigstore bundle before it runs.
  mcp-registry:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # the registry's GitHub OIDC sign-in
    env:
      # To upgrade: pick a release, then recompute the SHA-256 of
      # mcp-publisher_linux_amd64.tar.gz; the registry's v1.8.1 doc example
      # shows the cosign identity format.
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry
        run: "$RUNNER_TEMP/mcp-publisher login github-oidc"

      - name: Publish to the MCP Registry
        working-directory: packages/cli
        run: "$RUNNER_TEMP/mcp-publisher publish"
