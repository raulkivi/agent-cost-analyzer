name: Release Agent Cost Analyzer

# Publishes the standalone app on an `app-v<major>.<minor>.<patch>` tag
# (vscode-extension.md §7.2, npm-package.md §4.10): the `agent-cost-analyzer`
# npm package, then a GitHub Release with the same tarball attached. The
# build job tests and packs once; the publish job, in the `release`
# environment, publishes exactly that tarball (SHA-256 checked) through npm
# trusted publishing (OIDC), which also attaches the provenance attestation.
# No npm token or secret exists. Setup is the owner's, before the first tag:
# an npm trusted publisher on the package (user `raulkivi`, repository
# `agent-cost-analyzer`, workflow `release-app.yml`, environment `release`;
# npm expires it unused after 2 days) and `app-v*` added to the `release`
# environment's deployment rule (NP11/V17).

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag must name the root package.json's version and packages/cli's.
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: node packages/vscode-extension/scripts/release-check.mts "$TAG" app-v package.json --also packages/cli/package.json >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The standalone app's usage-scenario suite, as the web-e2e job in ci.yml
      # runs it (step 15.9). The root build above already builds packages/web.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - run: npm run test:e2e --workspace=packages/web -- --trace off
      # Failure screenshots (traces are off, as the suite runs in CI).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-out
          path: packages/web/e2e/out/
          if-no-files-found: ignore

      # The MCP App views in a fake MCP Apps host, as the mcp-apps-e2e job in
      # ci.yml runs it (step 10.17 G5). The root build above builds
      # packages/mcp-apps/dist/views.html.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/mcp-apps
      - run: npm run test:e2e --workspace=packages/mcp-apps -- --trace off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mcp-apps-e2e-out
          path: packages/mcp-apps/e2e/out/
          if-no-files-found: ignore

      # Dependencies bundled into the package are invisible to users' own
      # `npm audit`, so a high-severity finding blocks the release (§5).
      - run: npm audit --omit=dev --audit-level=high

      # One pack; every later step and the publish job use this file. Tarball
      # paths start with `./`, as npm reads a bare `dir/x.tgz` as a repo spec.
      - id: pack
        run: |
          mkdir npm-release
          npm pack --workspace=packages/cli --pack-destination npm-release --json | node -e 'process.stdout.write("tarball=" + JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename + "\n")' >> "$GITHUB_OUTPUT"

      - name: SHA-256
        working-directory: npm-release
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: sha256sum "$TARBALL" | tee SHA256SUMS

      # Install, start and drive the packed tarball in a browser (NP7); the
      # Chromium from the web suite above is the one it uses.
      - name: Smoke test the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run smoke:npm-package -- --tarball "./npm-release/$TARBALL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: npm-smoke-out
          path: packages/cli/smoke/out/
          if-no-files-found: ignore

      # The same npm the publish job runs, so a refusal shows here first.
      - run: npm install -g npm@11.21.1
      - name: Publish dry run
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish --dry-run "./npm-release/$TARBALL"

      - name: Release notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: node packages/vscode-extension/scripts/release-notes.mts CHANGELOG.md "$VERSION" > npm-release/release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: npm-release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing through OIDC
    env:
      TARBALL: ./npm-release/${{ needs.build.outputs.tarball }}
    steps:
      # Only for the scripts/ checks and the repository `gh` needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: npm-release

      - name: Verify the tarball is the one the build tested
        run: node scripts/verify-sha256.mjs npm-release/SHA256SUMS

      # Trusted publishing needs npm 11.5.1+ and Node 22.14+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1

      # The package exists as the owner's placeholder, so this check always
      # applies: refuse to publish to a package anyone else maintains.
      - name: Check the maintainers
        run: npm view agent-cost-analyzer maintainers --json | node scripts/check-npm-maintainers.mjs raulkivi

      # No npm token: npm signs in through OIDC and adds provenance.
      - name: Publish to npm
        run: npm publish "$TARBALL" --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$TAG" "$TARBALL" --title "Agent Cost Analyzer $VERSION" --notes-file npm-release/release-notes.md --verify-tag
