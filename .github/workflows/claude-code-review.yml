name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

permissions:
  contents: read

jobs:
  # Same docs-only rule as ci.yml (scripts/ci-change-scope.mjs). A workflow-level
  # `paths-ignore` can't express it: the docs that tests read are exceptions
  # inside docs/**, and paths-ignore takes no negations.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          git diff --name-only "origin/${BASE_REF}...HEAD" | node scripts/ci-change-scope.mjs >> "$GITHUB_OUTPUT"

  claude-review:
    needs: changes
    # Dependabot and fork PRs get no repository secrets, so the token would be empty.
    # A docs-only PR needs no code review.
    if: needs.changes.outputs.docs_only != 'true' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # threat-model.md §5.5: the code-review plugin is pinned to a commit,
      # like every action here, so a run never executes whatever a default
      # branch holds that day. Anthropic's marketplace entry for it follows
      # claude-plugins-official's main, and its name is reserved for that
      # GitHub source, so a local copy of it can't be added. Instead this
      # step writes a one-plugin marketplace pinning the plugin's own source
      # by sha. It is written here, not committed, so it is only ever this
      # workflow file, which the action checks against main before a run.
      # Bump the sha by hand after reading the diff; Dependabot can't.
      - name: Write the pinned code-review plugin marketplace
        run: |
          mkdir -p "$RUNNER_TEMP/review-plugins/.claude-plugin"
          cat > "$RUNNER_TEMP/review-plugins/.claude-plugin/marketplace.json" <<'JSON'
          {
            "name": "pinned-review-plugins",
            "owner": { "name": "agent-cost-analyzer" },
            "plugins": [
              {
                "name": "code-review",
                "source": {
                  "source": "git-subdir",
                  "url": "https://github.com/anthropics/claude-plugins-official.git",
                  "path": "plugins/code-review",
                  "ref": "main",
                  "sha": "0412be76f50ab4f4f8abff3753efa9269fbbca5b"
                }
              }
            ]
          }
          JSON

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: '${{ runner.temp }}/review-plugins'
          plugins: 'code-review@pinned-review-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

