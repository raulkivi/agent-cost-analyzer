name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides whether the heavy UI/integration jobs run (docs/plans/release-ui-gate.md
  # G1): a docs-only PR skips them. A job skipped by its job-level `if` counts
  # as passed for the required checks, so the PR stays mergeable. `test` never
  # depends on this job: it holds lint, typecheck and the unit tests that read docs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three-dot: the PR's own changes since it branched from the base.
          git diff --name-only "origin/${BASE_REF}...HEAD" | node scripts/ci-change-scope.mjs >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run headers:check
      - run: npm run test:scripts
      - run: npm run typecheck
      # Ends with build:cli (packages/cli/dist). npm test's packages/cli
      # bundle test runs that build, its notices and `npm pack`; under CI
      # (set by Actions) a missing dist fails it instead of skipping.
      - run: npm run build
      - run: npm test

  # The standalone app's usage-scenario suite (Phase 15 step 15.9,
  # docs/plans/cost-by-repository-and-project.md §12.4): the real server and
  # web build over a seeded fixture home at a fixed clock, driven headless
  # by Playwright. A required check: no retries, so a failure is real.
  web-e2e:
    needs: changes
    # Fail safe: run unless the changes job succeeded AND found a docs-only PR.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/web
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - run: npm run test:e2e --workspace=packages/web -- --trace off
      # Failure screenshots (traces are off, as the suite runs in CI).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-out
          path: packages/web/e2e/out/
          if-no-files-found: ignore

  # The MCP App views in a fake MCP Apps host (step 10.17 G5,
  # docs/plans/release-ui-gate.md): the built views.html in an iframe driven
  # by ext-apps' AppBridge, tool calls answered by the real stdio server over
  # the web suite's fixture home, Claude's recorded theme sets, axe. Replaces
  # the Claude Desktop hand checks (A16 §2, A24 §2). No retries.
  mcp-apps-e2e:
    needs: changes
    # Fail safe: run unless the changes job succeeded AND found a docs-only PR.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/mcp-apps
      - run: npx playwright install --with-deps chromium
        working-directory: packages/mcp-apps
      - run: npm run test:e2e --workspace=packages/mcp-apps -- --trace off
      # Failure screenshots (traces are off, as the suite runs in CI).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mcp-apps-e2e-out
          path: packages/mcp-apps/e2e/out/
          if-no-files-found: ignore

  # The npm package (docs/plans/npm-package.md §4.8, task NP7): pack it, check
  # the tarball, install and run it from the tarball with scripts off and no
  # registry, check it over HTTP, in Chromium and over MCP stdio, and check
  # that it wrote only its own settings folder (scripts/npm-package-smoke.mts).
  # Node 22.18.0 is the minimum (engines), exact, on Linux, macOS and
  # Windows (NP8); Node 24 on Linux. NP9 makes the checks required.
  npm-package:
    needs: changes
    # Fail safe: run unless the changes job succeeded AND found a docs-only PR.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }} # codespell:ignore cancelled
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18.0"]
        include:
          - os: ubuntu-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds and packs, then runs every check against the tarball.
      - run: npm run smoke:npm-package
      # `mcp install`, `status` and `uninstall` from the tarball, for all six
      # clients in a temporary home with stub CLIs (mcp-client-setup.md §7,
      # MC7). Linux only (D13): the macOS and Windows legs run the serve smoke
      # alone. Packs the build the step above made.
      - if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-setup-pack"
          npm pack --workspace=packages/cli --pack-destination "$RUNNER_TEMP/mcp-setup-pack"
          npm run smoke:mcp-setup -- --tarball "$RUNNER_TEMP"/mcp-setup-pack/agent-cost-analyzer-*.tgz
      # The Claude Desktop bundle (mcp-client-setup.md §5.7, MC15): built from
      # a pack of the build above (the build script runs `mcpb validate` on
      # the manifest), unpacked, and its server started with the manifest's
      # own command; `tools/list` must match the tool-list snapshot. Nothing
      # is uploaded. Linux only (D13).
      - if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/mcpb-pack"
          npm pack --workspace=packages/cli --pack-destination "$RUNNER_TEMP/mcpb-pack"
          npm run mcpb:build -- --tarball "$(echo "$RUNNER_TEMP"/mcpb-pack/agent-cost-analyzer-*.tgz)" --out "$RUNNER_TEMP/mcpb-pack"
          npm run smoke:mcpb -- --tarball "$(echo "$RUNNER_TEMP"/mcpb-pack/agent-cost-analyzer-*.tgz)" --bundle "$(echo "$RUNNER_TEMP"/mcpb-pack/agent-cost-analyzer-*.mcpb)"
      # The smokes' logs, the server's and MCP server's stderr, the MCP stdout
      # lines, npm's debug logs and Playwright's failure screenshots.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: npm-package-smoke-${{ matrix.os }}-node-${{ matrix.node }}
          path: packages/cli/smoke/out/
          if-no-files-found: ignore

  # One check for the ruleset to require (npm-package.md NP9): the matrix legs'
  # names never appear on docs-only PRs, where the matrix is skipped.
  npm-package-result:
    name: npm-package-result
    # `changes` is needed so a skipped matrix counts as a pass only on a real
    # docs-only scope; a run canceled before the matrix also leaves it skipped.
    needs: [changes, npm-package]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RESULT: ${{ needs.npm-package.result }}
        run: |
          echo "changes: $CHANGES (docs_only=$DOCS_ONLY); npm-package: $RESULT"
          [ "$CHANGES" = success ] || exit 1
          case "$RESULT" in
            success) ;;
            skipped) [ "$DOCS_ONLY" = true ] || exit 1 ;;
            *) exit 1 ;;
          esac

  # The AI Credits Analyzer VS Code extension (docs/plans/vscode-extension.md
  # §7.1): its unit tests, then the real-VS Code integration suite on the
  # stable build, under a virtual display.
  extension:
    needs: changes
    # Fail safe: run unless the changes job succeeded AND found a docs-only PR.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Builds the web app in extension mode first, then dist/ and media/.
      - run: npm run build --workspace=packages/vscode-extension
      # Includes the bundle-boundary and bundle-load tests.
      - run: npm test --workspace=packages/vscode-extension
      - run: xvfb-run -a npm run test:integration --workspace=packages/vscode-extension
      # The webview in Chromium with VS Code's Dark Modern, Light Modern and
      # High Contrast colours at 600-1600 px: nothing cut off on the right,
      # every text readable (step 10.11).
      - run: npx playwright install --with-deps chromium
        working-directory: packages/vscode-extension
      - run: npm run test:ui --workspace=packages/vscode-extension

      # The .vsix the owner installs for the manual checks
      # (docs/plans/vscode-extension-manual-checks.md).
      - run: npm run package --workspace=packages/vscode-extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error

  # The manual checks that need a real workbench and webview, driven with
  # wdio-vscode-service under a virtual display (step 10.16,
  # docs/plans/vscode-ui-automation.md). A required check on every PR by owner
  # decision D4 (2026-11-11, step 10.17, docs/plans/release-ui-gate.md); the
  # release workflow runs the same suite.
  extension-ui:
    needs: changes
    # Fail safe: run unless the changes job succeeded AND found a docs-only PR.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/vscode-extension
      # The VS Code download is pinned (PINNED_VSCODE_VERSION in
      # scripts/ui-automation/vscode-version.mts); the key hashes it so a
      # version bump starts a fresh cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/vscode-extension/.wdio-vscode-service
          key: wdio-vscode-service-${{ runner.os }}-${{ hashFiles('packages/vscode-extension/wdio.conf.mts', 'packages/vscode-extension/scripts/ui-automation/vscode-version.mts') }}
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:ui:vscode --workspace=packages/vscode-extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vscode-ui-out
          path: packages/vscode-extension/test/ui/out/
          if-no-files-found: ignore
