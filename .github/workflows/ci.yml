name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The AI Credits Analyzer VS Code extension (docs/plans/vscode-extension.md
  # §7.1): its unit tests, then the real-VS Code integration suite on the
  # stable build, under a virtual display.
  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Builds the web app in extension mode first, then dist/ and media/.
      - run: npm run build --workspace=packages/vscode-extension
      # Includes the bundle-boundary and bundle-load tests.
      - run: npm test --workspace=packages/vscode-extension
      - run: xvfb-run -a npm run test:integration --workspace=packages/vscode-extension

      # Packaging goes here (§7.1 step 4: `vsce package` and uploading the
      # .vsix with actions/upload-artifact pinned by SHA); added with the
      # step 10.9 packaging work.
