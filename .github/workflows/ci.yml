name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run headers:check
      - run: npm run test:scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The standalone app's usage-scenario suite (Phase 15 step 15.9,
  # docs/plans/cost-by-repository-and-project.md §12.4): the real server and
  # web build over a seeded fixture home at a fixed clock, driven headless
  # by Playwright. A required check: no retries, so a failure is real.
  web-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/web
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - run: npm run test:e2e --workspace=packages/web -- --trace off
      # Failure screenshots (traces are off, as the suite runs in CI).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-out
          path: packages/web/e2e/out/
          if-no-files-found: ignore

  # The AI Credits Analyzer VS Code extension (docs/plans/vscode-extension.md
  # §7.1): its unit tests, then the real-VS Code integration suite on the
  # stable build, under a virtual display.
  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Builds the web app in extension mode first, then dist/ and media/.
      - run: npm run build --workspace=packages/vscode-extension
      # Includes the bundle-boundary and bundle-load tests.
      - run: npm test --workspace=packages/vscode-extension
      - run: xvfb-run -a npm run test:integration --workspace=packages/vscode-extension
      # The webview in Chromium with VS Code's Dark Modern, Light Modern and
      # High Contrast colours at 600-1600 px: nothing cut off on the right,
      # every text readable (step 10.11).
      - run: npx playwright install --with-deps chromium
        working-directory: packages/vscode-extension
      - run: npm run test:ui --workspace=packages/vscode-extension

      # The .vsix the owner installs for the manual checks
      # (docs/plans/vscode-extension-manual-checks.md).
      - run: npm run package --workspace=packages/vscode-extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error

  # The manual checks that need a real workbench and webview, driven with
  # wdio-vscode-service under a virtual display (step 10.16,
  # docs/plans/vscode-ui-automation.md). A required check on every PR by owner
  # decision D4 (2026-11-11, step 10.17, docs/plans/release-ui-gate.md); the
  # release workflow runs the same suite.
  extension-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/vscode-extension
      # The VS Code download is pinned (PINNED_VSCODE_VERSION in
      # scripts/ui-automation/vscode-version.mts); the key hashes it so a
      # version bump starts a fresh cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/vscode-extension/.wdio-vscode-service
          key: wdio-vscode-service-${{ runner.os }}-${{ hashFiles('packages/vscode-extension/wdio.conf.mts', 'packages/vscode-extension/scripts/ui-automation/vscode-version.mts') }}
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:ui:vscode --workspace=packages/vscode-extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vscode-ui-out
          path: packages/vscode-extension/test/ui/out/
          if-no-files-found: ignore
